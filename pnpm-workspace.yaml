---
packages:
  - ./npm/eslint-config/
  - ./npm/prettier-config/
catalog:
  eslint: 10.15.0
  prettier: 3.10.1
# Packages allowed to run install/lifecycle scripts (pnpm 11: replaces onlyBuiltDependencies).
allowBuilds:
  better-sqlite3: true
  core-js-pure: true
  dtrace-provider: true
  protobufjs: true
  re2: true
